server:
  port: ${SERVER_PORT:8081}
  # Build public URLs (Location...) from X-Forwarded-* headers set by the gateway.
  # Safe only because services are never exposed directly: the gateway is the single entry point.
  forward-headers-strategy: framework

spring:
  threads:
    virtual:
      # Blocking calls (JDBC, RestClient) park a cheap virtual thread instead of holding a platform thread.
      enabled: true
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys from the JWK set URI (internal Keycloak URL in containers); issuer and audience still checked.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/event-platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/event-platform/protocol/openid-connect/certs}
          audiences: event-platform-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5433}/${USER_DB_NAME:user_db}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  # Traces over OTLP (HTTP) to the OpenTelemetry collector: Grafana Tempo in development (compose service otel-lgtm).
  tracing:
    sampling:
      # 10 % unless told otherwise (production); compose and .env.example set 100 % for development.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    version: openapi_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: method
  paths-to-match: /api/**
  default-produces-media-type: application/json

# SQL spans: queries only (no connection or result-set spans), never the parameter values (personal data).
jdbc:
  includes: query
  datasource-proxy:
    include-parameter-values: false
