server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          # Public paths are identical to service paths: the gateway only routes and never
          # rewrites paths, so URLs generated by services (Location, problem instance) stay valid.
          routes:
            - id: event-service
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api/events/**
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**
            - id: registration-service
              uri: ${REGISTRATION_SERVICE_URI:lb://registration-service}
              predicates:
                - Path=/api/registrations/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
