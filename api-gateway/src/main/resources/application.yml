server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    # Local settings when started from the IDE (sampling probability), like the other services.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are fetched from the JWK set URI (internal Keycloak URL in containers, no discovery call at
          # startup) while every token must still carry the public issuer and the platform audience.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/event-platform}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/event-platform/protocol/openid-connect/certs}
          audiences: event-platform-api
  cloud:
    circuitbreaker:
      resilience4j:
        # The default 1 s TimeLimiter would cut slow but legitimate calls:
        # the httpclient response-timeout stays the single timeout.
        disable-time-limiter: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          # Public paths are identical to service paths: the gateway only routes and never
          # rewrites paths, so URLs generated by services (Location, problem instance) stay valid.
          routes:
            - id: event-service
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api/events/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: event-service
                    fallbackUri: forward:/fallback/unavailable
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: ""
                    exceptions: java.io.IOException
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/unavailable
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: ""
                    exceptions: java.io.IOException
            - id: registration-service
              uri: ${REGISTRATION_SERVICE_URI:lb://registration-service}
              predicates:
                - Path=/api/registrations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: registration-service
                    fallbackUri: forward:/fallback/unavailable
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: ""
                    exceptions: java.io.IOException
            # API docs of each service, aggregated by the Swagger UI (see springdoc below). Docs only:
            # no circuit breaker or retry. Not under /v3/api-docs, which the gateway's own springdoc
            # controller serves before any route is evaluated.
            - id: user-service-api-docs
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
            - id: event-service-api-docs
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api-docs/event-service
              filters:
                - SetPath=/v3/api-docs
            - id: registration-service-api-docs
              uri: ${REGISTRATION_SERVICE_URI:lb://registration-service}
              predicates:
                - Path=/api-docs/registration-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    # A single Swagger UI for the whole platform: http://localhost:8080/swagger-ui.html
    urls:
      - name: User
        url: /api-docs/user-service
      - name: Event
        url: /api-docs/event-service
      - name: Registration
        url: /api-docs/registration-service
    # "Authorize": Keycloak sign-in with the public client of the realm (authorization code + PKCE, no secret).
    # The documents declare the scheme (platform-security PlatformOpenApi); Keycloak redirects back to
    # /webjars/swagger-ui/oauth2-redirect.html, allowed by the client's http://localhost:8080/* redirect URIs.
    oauth:
      client-id: event-platform-web
      use-pkce-with-authorization-code-grant: true
      scopes:
        - openid

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
  # Traces over OTLP (HTTP) to the OpenTelemetry collector: Grafana Tempo in development (compose service otel-lgtm).
  tracing:
    sampling:
      # 10 % unless told otherwise (production); compose and .env.example set 100 % for development.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        url: ${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

gateway:
  # One breaker per route, all sharing these settings; every routing error counts as a failure.
  circuit-breaker:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
    permitted-number-of-calls-in-half-open-state: 3
