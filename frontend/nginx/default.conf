# Serves the Angular build and relays the gateway paths: the browser sees one origin, so the gateway session cookie
# and the XSRF-TOKEN cookie work without CORS. Unprivileged image: port 8080, non-root user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker DNS, re-resolved: nginx starts even before the gateway and follows its restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    include /etc/nginx/snippets/security-headers.conf;

    # API, session (BFF) and OAuth2 login flow. The Host header is kept: the gateway builds the OAuth2 redirect URI
    # (http://localhost:4200/login/oauth2/code/keycloak) from it.
    location ~ ^/(api|bff|oauth2|login|logout)(/|$) {
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Build files carry a content hash in their name: cached for a year.
    location ~* \.(?:js|css|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes: every other path is the application. index.html is never cached: a release is seen at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
