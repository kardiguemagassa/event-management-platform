# Active in containers (SPRING_PROFILES_ACTIVE=docker). Hosts and secrets come from environment variables.
# Short intervals: a stopped or new instance is seen in seconds instead of ~90 s. Production keeps the defaults.
eureka:
  instance:
    # Unique per container: replicas never overwrite (and unregister) each other.
    instance-id: ${spring.application.name}:${random.value}
    # A container on several networks has several IPs, picked in no guaranteed order. Announce the compose
    # service name instead: Docker DNS resolves it on the network the caller shares with this service.
    hostname: ${spring.application.name}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    registry-fetch-interval-seconds: 5
    # Status changes (STARTING -> UP) are published within seconds instead of 30 s:
    # the on-demand update quota is derived from this interval (4/min by default, 24/min here).
    instance-info-replication-interval-seconds: 5

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
