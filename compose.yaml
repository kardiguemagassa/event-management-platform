name: event-platform

# Common settings of the Spring Boot containers. They belong to the "app" profile, so a plain
# "docker compose up -d" still starts the databases only (services run from the IDE), while
# "docker compose --profile app up -d --build" starts the whole platform.
# Images are ${IMAGE_NAMESPACE:-local}/event-platform-<service>:${IMAGE_TAG:-dev}. To run a published release:
#   IMAGE_NAMESPACE=kardigue IMAGE_TAG=1.0.0 docker compose --profile app pull
#   IMAGE_NAMESPACE=kardigue IMAGE_TAG=1.0.0 docker compose --profile app up -d --no-build
x-spring-service: &spring-service
  profiles: [app]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        # The JVM sizes its heap from this limit (MaxRAMPercentage=75 in the image).
        memory: 512M

x-spring-environment: &spring-environment
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_URL: http://discovery-server:8761/eureka
  # Token validation: keys from Keycloak on the compose network, issuer as written in tokens (public URL).
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/event-platform/protocol/openid-connect/certs
  KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/event-platform
  # Every request traced in development, traces, metrics and logs sent to the collector on the compose network.
  TRACING_SAMPLING_PROBABILITY: "1.0"
  OTEL_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
  OTEL_METRICS_ENDPOINT: http://otel-lgtm:4318/v1/metrics
  OTEL_LOGS_ENDPOINT: http://otel-lgtm:4318/v1/logs

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 30s

services:
  user-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
      POSTGRES_USER: ${USER_DB_USERNAME:?USER_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-5433}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql
    networks: [user-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  event-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${EVENT_DB_NAME:-event_db}
      POSTGRES_USER: ${EVENT_DB_USERNAME:?EVENT_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD:?EVENT_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${EVENT_DB_PORT:-5434}:5432"
    volumes:
      - event-db-data:/var/lib/postgresql
    networks: [event-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  registration-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${REGISTRATION_DB_NAME:-registration_db}
      POSTGRES_USER: ${REGISTRATION_DB_USERNAME:?REGISTRATION_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${REGISTRATION_DB_PASSWORD:?REGISTRATION_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${REGISTRATION_DB_PORT:-5435}:5432"
    volumes:
      - registration-db-data:/var/lib/postgresql
    networks: [registration-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql
    networks: [keycloak-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Identity provider, realm imported from ./keycloak at first start (an existing realm is never overwritten).
  # Development mode (plain HTTP); production would run "start" behind TLS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?KEYCLOAK_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Tokens carry the public URL seen by the browser; containers reach Keycloak as keycloak:8080.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholder resolved in the realm file at import: no secret in Git.
      REGISTRATION_SERVICE_CLIENT_SECRET: ${REGISTRATION_SERVICE_CLIENT_SECRET:?REGISTRATION_SERVICE_CLIENT_SECRET is required}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks: [default, keycloak-net]
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl: plain bash on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Observability backend for development, in one container: OpenTelemetry collector (OTLP), Tempo (traces),
  # Prometheus (metrics), Loki (logs) and Grafana. Not a production setup: no persistence, default admin account.
  otel-lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"   # Grafana (admin / admin)
      - "127.0.0.1:4318:4318"                     # OTLP over HTTP, for services started from the IDE
      - "127.0.0.1:3200:3200"                     # Tempo API: traces by id (end-to-end test)
      - "127.0.0.1:3100:3100"                     # Loki API: logs of a trace (end-to-end test)
    # The platform's dashboards (observability/grafana), provisioned at startup in the "Event Platform" folder.
    volumes:
      - ./observability/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/event-platform.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/event-platform:ro

  discovery-server:
    <<: *spring-service
    image: ${IMAGE_NAMESPACE:-local}/event-platform-discovery-server:${IMAGE_TAG:-dev}
    build:
      context: .
      args:
        MODULE: discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health/readiness"]

  user-service:
    <<: *spring-service
    image: ${IMAGE_NAMESPACE:-local}/event-platform-user-service:${IMAGE_TAG:-dev}
    networks: [default, user-net]
    build:
      context: .
      args:
        MODULE: user-service
    # Each service receives its own database credentials only (least privilege).
    environment:
      <<: *spring-environment
      USER_DB_HOST: user-db
      USER_DB_PORT: 5432
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      USER_DB_USERNAME: ${USER_DB_USERNAME:?USER_DB_USERNAME is required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
    depends_on:
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]

  event-service:
    <<: *spring-service
    image: ${IMAGE_NAMESPACE:-local}/event-platform-event-service:${IMAGE_TAG:-dev}
    networks: [default, event-net]
    build:
      context: .
      args:
        MODULE: event-service
    environment:
      <<: *spring-environment
      EVENT_DB_HOST: event-db
      EVENT_DB_PORT: 5432
      EVENT_DB_NAME: ${EVENT_DB_NAME:-event_db}
      EVENT_DB_USERNAME: ${EVENT_DB_USERNAME:?EVENT_DB_USERNAME is required}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?EVENT_DB_PASSWORD is required}
    depends_on:
      event-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]

  registration-service:
    <<: *spring-service
    image: ${IMAGE_NAMESPACE:-local}/event-platform-registration-service:${IMAGE_TAG:-dev}
    networks: [default, registration-net]
    build:
      context: .
      args:
        MODULE: registration-service
    # No dependency on user-service or event-service: their availability is handled at runtime
    # (Eureka, retry, circuit breaker), not at startup.
    environment:
      <<: *spring-environment
      REGISTRATION_DB_HOST: registration-db
      REGISTRATION_DB_PORT: 5432
      REGISTRATION_DB_NAME: ${REGISTRATION_DB_NAME:-registration_db}
      REGISTRATION_DB_USERNAME: ${REGISTRATION_DB_USERNAME:?REGISTRATION_DB_USERNAME is required}
      REGISTRATION_DB_PASSWORD: ${REGISTRATION_DB_PASSWORD:?REGISTRATION_DB_PASSWORD is required}
      # Client credentials of its service account, token requested from Keycloak on the compose network.
      REGISTRATION_SERVICE_CLIENT_SECRET: ${REGISTRATION_SERVICE_CLIENT_SECRET:?REGISTRATION_SERVICE_CLIENT_SECRET is required}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/event-platform/protocol/openid-connect/token
    depends_on:
      registration-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health/readiness"]

  api-gateway:
    <<: *spring-service
    image: ${IMAGE_NAMESPACE:-local}/event-platform-api-gateway:${IMAGE_TAG:-dev}
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      <<: *spring-environment
    # Single public entry point; the services themselves publish no port.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]

volumes:
  user-db-data:
  event-db-data:
  registration-db-data:
  keycloak-db-data:

networks:
  # One private network per service and its database: a database is reachable by its owner only.
  # Spring services also join "default" to reach Eureka, the gateway and each other.
  user-net:
  event-net:
  registration-net:
  keycloak-net:
