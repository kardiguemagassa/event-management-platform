# Weekly update pull requests, opened against dev like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # Paired with the OpenTelemetry SDK that Spring Boot manages (see opentelemetry-instrumentation.version in the
      # root pom): a newer appender needs a newer SDK and fails at runtime. Updated with Spring Boot, by hand.
      - dependency-name: io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      # The TypeScript major is set by the Angular version (its supported range): updated with Angular, by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # Angular packages move together (framework, CLI, Material): one pull request per release.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
