# Event Platform login theme: Keycloak's plain "base" templates with the look of the web application.
# Only template.ftl is overridden (brand, lead, link back); login and registration forms stay Keycloak's own.
parent=base
import=common/keycloak

styles=css/event-platform.css

locales=fr,en

# Class names for the stylesheet (the "base" theme leaves them empty).
kcHtmlClass=ep
kcLoginClass=ep-page
kcHeaderClass=ep-header
kcFormCardClass=ep-card
kcFormHeaderClass=ep-card-header
kcFormGroupClass=ep-group
kcLabelClass=ep-label
kcInputClass=ep-input
kcInputGroup=ep-input-group
kcInputErrorMessageClass=ep-error
kcAlertClass=ep-alert
kcAlertTitleClass=ep-alert-text
kcButtonClass=ep-button
kcButtonPrimaryClass=ep-button-primary
kcFormPasswordVisibilityButtonClass=ep-toggle
kcFormPasswordVisibilityIconShow=ep-icon-show
kcFormPasswordVisibilityIconHide=ep-icon-hide
kcSignUpClass=ep-alt
