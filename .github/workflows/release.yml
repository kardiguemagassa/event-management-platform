name: Release

# main: images tagged "main" and "sha-<commit>". Tag vX.Y.Z: "X.Y.Z", "X.Y" and "latest".
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Least privilege: the jobs only read the repository; Docker Hub access comes from the secrets.
permissions:
  contents: read

# Releases never cancel each other: every merge to main and every tag gets its images.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag can point at any commit: never publish an image without green tests.
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  image:
    name: image (${{ matrix.module }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [discovery-server, api-gateway, user-service, event-service, registration-service]
    env:
      IMAGE: kardigue/event-platform-${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only the runtime stage runs emulated on arm64; Maven compiles once, natively ($BUILDPLATFORM).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Logged in before any build: authenticated pulls also avoid the anonymous Docker Hub rate limit.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-
      # Tag vX.Y.Z: X.Y.Z. Push to main: 0.0.0-<commit>-SNAPSHOT, traceable but never mistaken for a release.
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then revision="${GITHUB_REF_NAME#v}"; else revision="0.0.0-${GITHUB_SHA::7}-SNAPSHOT"; fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Build for the scan (amd64, kept on the runner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            MODULE=${{ matrix.module }}
            REVISION=${{ steps.version.outputs.revision }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
      # Nothing is pushed if a CRITICAL vulnerability has a fix available.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build and push (amd64 and arm64, with SBOM and provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            MODULE=${{ matrix.module }}
            REVISION=${{ steps.version.outputs.revision }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
