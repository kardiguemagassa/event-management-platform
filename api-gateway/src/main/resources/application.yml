server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    circuitbreaker:
      resilience4j:
        # The default 1 s TimeLimiter would cut slow but legitimate calls:
        # the httpclient response-timeout stays the single timeout.
        disable-time-limiter: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          # Public paths are identical to service paths: the gateway only routes and never
          # rewrites paths, so URLs generated by services (Location, problem instance) stay valid.
          routes:
            - id: event-service
              uri: ${EVENT_SERVICE_URI:lb://event-service}
              predicates:
                - Path=/api/events/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: event-service
                    fallbackUri: forward:/fallback/unavailable
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: ""
                    exceptions: java.io.IOException
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/unavailable
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: ""
                    exceptions: java.io.IOException
            - id: registration-service
              uri: ${REGISTRATION_SERVICE_URI:lb://registration-service}
              predicates:
                - Path=/api/registrations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: registration-service
                    fallbackUri: forward:/fallback/unavailable
                - name: Retry
                  args:
                    retries: 1
                    methods: GET
                    series: ""
                    exceptions: java.io.IOException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  # One breaker per route, all sharing these settings; every routing error counts as a failure.
  circuit-breaker:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
    permitted-number-of-calls-in-half-open-state: 3
