server:
  port: ${SERVER_PORT:8081}
  # Build public URLs (Location...) from X-Forwarded-* headers set by the gateway.
  # Safe only because services are never exposed directly: the gateway is the single entry point.
  forward-headers-strategy: framework

spring:
  threads:
    virtual:
      # Blocking calls (JDBC, RestClient) park a cheap virtual thread instead of holding a platform thread.
      enabled: true
  application:
    name: user-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5433}/${USER_DB_NAME:user_db}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    version: openapi_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: method
  paths-to-match: /api/**
  default-produces-media-type: application/json
