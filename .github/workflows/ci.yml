name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push cancels the run still in progress for the same pull request or branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, then integration tests against real PostgreSQL containers (Testcontainers).
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
      # Shown on the run page; also on failure, to see which module fell below its floor.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Test coverage (unit and integration tests)"
            echo
            echo "| Module | Lines | Branches |"
            echo "|---|---|---|"
            for f in */target/site/jacoco/jacoco.csv; do
              [ -f "$f" ] || continue
              awk -F, -v m="${f%%/*}" 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
                END { if (lm + lc > 0) printf "| %s | %.1f%% | %.1f%% |\n", m, 100 * lc / (lm + lc), (bm + bc) ? 100 * bc / (bm + bc) : 100 }' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 7
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # Web application: lint, unit tests, production build, and the generated API client matching the committed
  # OpenAPI documents (the e2e job checks that those documents match the running services).
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API client is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/app/api || { echo "::error::Run 'npm run api:generate' and commit src/app/api"; exit 1; }
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run build

  e2e:
    name: e2e
    needs: [build, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Throwaway database passwords for this run only: nothing is stored as a secret, nothing is logged.
      - name: Create .env
        run: |
          cp .env.example .env
          for key in USER_DB_PASSWORD EVENT_DB_PASSWORD REGISTRATION_DB_PASSWORD KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD REGISTRATION_SERVICE_CLIENT_SECRET BFF_CLIENT_SECRET; do
            value=$(openssl rand -hex 16)
            echo "::add-mask::$value"
            sed -i "s|^${key}=.*|${key}=${value}|" .env
          done
      - name: Start the platform
        run: docker compose --profile app up -d --build --wait --wait-timeout 300
      - name: End-to-end scenario
        run: ./scripts/e2e-docker.sh
      # The front-end is generated from frontend/openapi: those documents must be the ones the services serve.
      - name: OpenAPI documents of the front-end match the services
        run: ./scripts/openapi.sh check
      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color --tail=200
      - name: Stop the platform
        if: always()
        run: docker compose --profile app down -v
